[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "sfsc2026"
version = "0.1.0"
description = "Reproducible development tools for the Solar Filament Segmentation Challenge 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.4",
  "pillow==12.2.0",
  "pycocotools==2.0.11",
  "scipy==1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.5",
]

[project.scripts]
sfsc-audit = "sfsc.audit:main"
sfsc-system = "sfsc.cli:main"
sfsc-model-worker = "sfsc.model_worker:main"
sfsc-watch = "sfsc.watch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfsc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The embedded HTML/JS/CSS dashboard template has inherently long lines.
"src/sfsc/watch.py" = ["E501"]
